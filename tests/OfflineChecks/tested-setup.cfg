## Settings file was created by plugin Void Crew VR UI Fix v3.13.0
## Plugin GUID: com.user.voidcrew.vruifix

[Aiming]

## While you play (no menu or terminal open), the UI screen follows your head so the crosshair stays in the middle of your view, and weapons, tools and 'press E' interactions aim where you look. Your body still turns with the mouse. In a turret, the turret turns to wherever you look and the mouse turns your view. Off: you aim with the mouse only and the crosshair stays in front of the game camera.
# Setting type: Boolean
# Default value: true
Aim With Your Head = true

[Cursor]

## Draws the mouse cursor on the UI panel whenever the game shows a cursor (menus, terminals).
# Setting type: Boolean
# Default value: true
Show VR Cursor = true

## Size multiplier for the VR cursor.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.5 to 4
Cursor Scale = 1.8

## Hides the normal Windows cursor while in VR so you don't see two cursors on the desktop window.
# Setting type: Boolean
# Default value: true
Hide Windows Cursor = true

[Debug]

## Advanced. Sends the UI image to SteamVR from Unity's render thread (correct ordering). Turn off only if the game crashes when the SteamVR overlay is used.
# Setting type: Boolean
# Default value: true
Submit Overlay On Render Thread = true

## Logs extra detail about every change the plugin makes, and what is under the mouse on every click. Leave off unless you are diagnosing a problem.
# Setting type: Boolean
# Default value: false
Verbose Logging = false

## Used by the plugin to update settings saved by older versions. Don't change it.
# Setting type: Int32
# Default value: 0
Settings Version = 4

[Fixes]

## Re-projects pings, objective markers and interaction prompts so they line up with world objects on the VR UI panel.
# Setting type: Boolean
# Default value: true
Align Markers To Panel = true

## Moves HUD canvases that the game renders in front of the camera onto the VR UI panel, instead of a flat sheet stuck to your face.
# Setting type: Boolean
# Default value: true
Move Camera Canvases To Panel = true

## Shows the start-up intro video on the VR UI panel. The game normally draws it on the camera near plane, which breaks in VR.
# Setting type: Boolean
# Default value: true
Fix Intro Video = true

## Keeps a terminal's screen on the terminal while you use it. The game attaches it to the camera, which in VR makes it follow your head and slide through the terminal and walls.
# Setting type: Boolean
# Default value: true
Keep Terminal Screens In World = true

## While you use a terminal, the VR UI panel (mouse pointer and button hints) moves onto the terminal's screen, at its distance and size, so the pointer sits on the screen itself. Only when the UI panel stays in front of the game camera (not when it follows your head).
# Setting type: Boolean
# Default value: true
UI On Terminal Screens = true

## Hides the dark border the game fades in along the screen edges while you control a turret (black bars when you zoom in). On a monitor it frames the picture; in VR it showed as a dark box around the UI.
# Setting type: Boolean
# Default value: true
Hide Turret Screen Border = true

## Hides the dark layer the game puts over the whole screen while the ping wheel (or another wheel) is held open. On a monitor it dims the world; in VR it made the UI screen and the head-locked HUDs dark boxes.
# Setting type: Boolean
# Default value: true
Hide Wheel Backdrop = true

## Removes DLSS from the graphics options while UUVR is installed. Set to false to try DLSS in VR (experimental): restart the game, then pick DLSS under Graphics > Upscaling. DLSS then only runs on the player camera.
# Setting type: Boolean
# Default value: true
Disable DLSS = false

## Removes FSR3 from the graphics options while UUVR is installed. FSR3 is not built for VR rendering.
# Setting type: Boolean
# Default value: true
Disable FSR3 = true

## Turns off UUVR's own UI handling at runtime (its config file is not changed). Required: UUVR's UI modes conflict with this plugin in HDRP games like Void Crew.
# Setting type: Boolean
# Default value: true
Disable UUVR UI = true

## Turns off the hidden helper cameras UUVR creates for head tracking. HDRP renders each one as a full extra VR camera, which costs a lot of FPS. Only applied when UUVR's Camera Tracking Mode is RelativeTransform (the default).
# Setting type: Boolean
# Default value: true
Disable UUVR Helper Cameras = true

## What the game window on your monitor shows while in VR.
## PanelView: what the headset shows (right eye), with the UI panel and cursor drawn where they appear in VR. You can play from it.
## HeadsetMirror: Unity's own mirror of the right eye (zoomed in, no UI).
## UiOnly: just the UI and cursor, full size, on black.
# Setting type: DesktopViewMode
# Default value: PanelView
# Acceptable values: PanelView, HeadsetMirror, UiOnly
Desktop View = PanelView

## How wide a view the game window shows in PanelView mode. Limited to what the headset renders.
# Setting type: Single
# Default value: 90
# Acceptable value range: From 30 to 170
Desktop View Width (degrees) = 100

## Aims the game window's view up (positive) or down (negative) in PanelView mode. At 0 the view is centred on the UI panel. Aiming up moves the UI down the window.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -30 to 30
Desktop View Height (degrees) = 0

## Shows the game in the game window on your monitor while in VR. Off leaves the window black and saves a little graphics work. The Desktop View On/Off hotkey switches it.
# Setting type: Boolean
# Default value: true
Desktop View On = true

## While Desktop View On is off, shows the game on the monitor again whenever the headset is taken off (using its proximity sensor), and hides it again when the headset is put back on.
# Setting type: Boolean
# Default value: true
Desktop View When Headset Is Off = true

## Clears the game window every frame. Stops old UI images being left behind as 'ghosts' or trails on the desktop.
# Setting type: Boolean
# Default value: true
Clear Desktop Each Frame = true

[FPS Counter]

## Where it sits in your view, left (negative) or right (positive).
# Setting type: Single
# Default value: -15
# Acceptable value range: From -60 to 60
Left/Right (degrees) = -17

## Where it sits in your view, down (negative) or up (positive).
# Setting type: Single
# Default value: 12
# Acceptable value range: From -60 to 60
Up/Down (degrees) = 15

## How far in front of your eyes it floats (forwards and backwards), in metres. It is always kept nearer than the UI screen; pieces at the same distance sit on the same plane.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.3 to 3
Distance = 0.6

## Its size: 1 is as big as it looks on the UI screen.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.5 to 2
Size = 1.2

[General]

## Master switch for the whole plugin.
# Setting type: Boolean
# Default value: true
Enabled = true

## How the game UI is shown in the headset.
## Auto: SteamVR overlay when UUVR uses OpenVR, otherwise the in-game panel.
## SteamVROverlay: sharpest result, drawn by SteamVR on top of the game (OpenVR only).
## InGamePanel: drawn into the game image (works with OpenVR and OpenXR).
# Setting type: UiDisplayMode
# Default value: Auto
# Acceptable values: Auto, SteamVROverlay, InGamePanel
UI Display Mode = SteamVROverlay

